<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HikeMate - Daftar Pendakian</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>HikeMate</h1>

        <p>
            Sistem Informasi Pendakian dan Kegiatan Pencinta Alam
        </p>
    </header>


    <!-- Navigation -->
    <nav>
        <ul>
            <li>
                <a href="index.html">Beranda</a>
            </li>

            <li>
                <a href="detail-gunung.html">Detail Gunung</a>
            </li>

            <li>
                <a href="daftar-pendakian.html">
                    Daftar Pendakian
                </a>
            </li>
        </ul>
    </nav>


    <!-- Main Content -->
    <main>

        <div class="hero">

            <h2>Daftar Pendakian</h2>

            <p>
                Isi formulir berikut untuk mencatat rencana
                kegiatan pendakian.
            </p>

        </div>


        <!-- Form Pendakian -->
        <form>

            <!-- Nama -->
            <label for="nama">
                Nama Lengkap:
            </label>

            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Masukkan nama lengkap"
            >


            <!-- Email -->
            <label for="email">
                Email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Masukkan email"
            >


            <!-- Gunung -->
            <label for="gunung">
                Pilih Gunung:
            </label>

            <select id="gunung" name="gunung">

                <option value="gede">
                    Gunung Gede
                </option>

                <option value="pangrango">
                    Gunung Pangrango
                </option>

                <option value="papandayan">
                    Gunung Papandayan
                </option>

            </select>


            <!-- Tanggal -->
            <label for="tanggal">
                Tanggal Pendakian:
            </label>

            <input
                type="date"
                id="tanggal"
                name="tanggal"
            >


            <!-- Jenis Pendakian -->
            <label>
                Jenis Pendakian:
            </label>

            <div class="radio-group">

                <label>
                    <input
                        type="radio"
                        name="jenis"
                        value="solo"
                    >
                    Solo
                </label>

                <label>
                    <input
                        type="radio"
                        name="jenis"
                        value="kelompok"
                    >
                    Kelompok
                </label>

            </div>


            <!-- Jumlah Pendaki -->
            <label for="jumlah">
                Jumlah Pendaki:
            </label>

            <input
                type="number"
                id="jumlah"
                name="jumlah"
                min="1"
                placeholder="Jumlah pendaki"
            >


            <!-- Catatan -->
            <label for="catatan">
                Catatan:
            </label>

            <textarea
                id="catatan"
                name="catatan"
                placeholder="Tambahkan catatan pendakian..."
            ></textarea>


            <!-- Persetujuan -->
            <div class="checkbox-group">

                <label>
                    <input
                        type="checkbox"
                        name="persetujuan"
                    >

                    Saya menyetujui aturan dan ketentuan pendakian.
                </label>

            </div>


            <!-- Submit -->
            <input
                type="submit"
                value="Daftar Pendakian"
            >

        </form>

    </main>


    <!-- Footer -->
    <footer>

        &copy; 2026 HikeMate.
        Sistem Informasi Pendakian.

    </footer>

</body>
</html>
